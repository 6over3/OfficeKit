name: CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - run: swift test
      - run: >-
          swift test --sanitize=thread
          --filter 'concurrentAttachmentURLRequestsShareOneStreamingExtraction|concurrentRelationshipAndWorksheetCachesRemainDeterministic'
      - run: swift build -c release
      - run: >-
          swift package --allow-writing-to-package-directory generate-documentation
          --target OfficeKit --output-path .build/OfficeKit.doccarchive --warnings-as-errors
      - run: >-
          swift run -c release OfficeKitBenchmarks --maximum-seconds 5 --detailed --all-xml
          Tests/OfficeKitTests/Fixtures/Open-XML-SDK/TestFiles/Presentation.pptx
          Tests/OfficeKitTests/Fixtures/Open-XML-SDK/TestFiles/Spreadsheet.xlsx
          Tests/OfficeKitTests/Fixtures/Open-XML-SDK/TestFiles/Complex01.docx
          Tests/OfficeKitTests/Fixtures/Open-XML-SDK/TestFiles/HelloWorldFlatOpc.xml
      - run: sh Benchmarks/generate-million-row-workbook.sh .build/million-rows.xlsx 1000000
      - run: >-
          swift run -c release OfficeKitBenchmarks --maximum-seconds 30
          --maximum-memory-mib 256 --streaming-rows-only .build/million-rows.xlsx
